# Agent preset minimal: one `@deepseek-ai/dsh-agent-preset` declaration.
# Edits saved by `omdsh plugin` or a profile patch override this row's
# `config.plugins` by id from the profile patch.
- insert:
    - id: preset-minimal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: minimal
        name: Minimal
        description: Focused two-tool coding agent with a persistent Bash session and str_replace_editor.
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful software engineer assistant.{{omdsh_agent_behavior}}
              complete: true
              includeRuntimeContext: false

          # `shell` is an omdsh alias for the host's one shell tool (`bash` on POSIX,
          # `pwsh` on Windows), so this two-tool shape holds on every platform without a
          # name that `tools.restrict()` would reject.
          - id: profile
            name: '@agi-fans/dsh-tui/agent-profile'
            config:
              tools:
                allow:
                  - shell
                  - str_replace_editor

          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: terminal
                name: '@deepseek-ai/dsh-terminal'

              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000

              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000

              # The PTY backend is shared; the dialect selects PowerShell on Windows.
              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000

              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000
