# Agent preset code: one `@deepseek-ai/dsh-agent-preset` declaration.
# Edits saved by `omdsh plugin` or a profile patch override this row's
# `config.plugins` by id from the profile patch.
- insert:
    - id: preset-code
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: code
        name: PTC
        description: Standard coding agent optimized for programmatic tool calling through the generated TypeScript SDK.
        order: 2
        plugins:
          - id: subagent-model-selection
            name: '@agi-fans/dsh-tui/subagent-model-selection'

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model. Prefer programmatic tool calling for multi-step operations when the generated tools SDK is available.

          # PTC presents the tool registry as a generated SDK over `run_code`, so a
          # general-purpose `workflow_run` would be a second model-authored
          # orchestration surface beside it. Nothing has to be denied here: the
          # workflow tool is mounted by the native presets, and an Agent sees only
          # the tools its own preset registers. `ralph` needs no entry either — the
          # deployment ships it disabled.

          # PTC for this preset alone; `standard`, `minimal`, and `cordis` inherit the
          # deployment's native executor. The row fails the mount when no PTC runtime is
          # composed, which is the point: the session does not choose its executor at
          # runtime any more.
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'

          # Upstream Standard/Cordis/PTC presets carry a clock reading at least
          # every ten minutes; the TUI process zone is the fallback display zone.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
