# omdsh composition — the TUI coding agent over the DeepSeek Harness core
# runtime. No Host, no HTTP, no browser layer: local executors, the
# executor-less agent spine, the DeepSeek adapter, and the omdsh TUI seam
# (provider + interactive runner).
#
# Model/provider rows read the CLI/environment overrides through the
# harness's sanctioned dynamic-config mechanism (!!js under plugin config).

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "(process.env.OMDSH_HOME || process.env.DSH_HOME || process.env.HOME + '/.dsh') + '/sessions'"

- id: session-checkpoint
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 8
    fallbackMaxBytes: 80
    maxTitleBytes: 120

- id: session-stats
  name: '@deepseek-ai/dsh-session-stats'

- id: session-query
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js "(process.env.OMDSH_HOME || process.env.DSH_HOME || process.env.HOME + '/.dsh') + '/sessions-query.sqlite'"
    openAt: first-search

- id: attachments
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    dshHome: !!js process.env.OMDSH_HOME || process.env.DSH_HOME || undefined

# User settings document ($DSH_HOME/settings.yaml) and credential sources
# (inherited env, managed .credentials.yaml, project/user .env) — the same
# rows the harness base mounts, so omdsh honors the user's existing model
# route and API key setup out of the box.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: !!js process.env.OMDSH_PROVIDER || 'deepseek-official'
    model: !!js process.env.OMDSH_MODEL || 'deepseek-v4-flash'

- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

# Trusted-local permission seam: the default matches an interactive coding
# agent on the user's own machine; OMDSH_PERMISSION_MODE narrows it.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.OMDSH_PERMISSION_MODE || 'danger-full-access'
    workspaceRoot: !!js process.cwd()

- id: fs
  name: '@deepseek-ai/dsh-fs-local'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536
    dshHome: !!js process.env.OMDSH_HOME || undefined
    skills:
      enabled: true
    goals:
      domain: {}
      tool: {}

# Human and model workflow contributions. The TUI discovers human commands
# from dsh-commands and renders unknown tools through its safe fallback.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  config:
    section: |
      You are in plan mode. Explore the workspace, resolve important design
      questions, and present a complete implementation plan through
      exit_plan_mode before making changes.

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'

- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: subagent-list
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tui
  name: '@omdsh/tui'
  config:
    model: !!js process.env.OMDSH_MODEL || 'deepseek-v4-flash'

- id: tui-tool-presentation
  name: '@omdsh/tui/tool-presentation'

- id: tui-session-runtime
  name: '@omdsh/tui/session-runtime'

- id: tui-human-interaction
  name: '@omdsh/tui/human-interaction'

- id: tui-command-session
  name: '@omdsh/tui/command-session'

- id: tui-command-queue
  name: '@omdsh/tui/command-queue'

- id: tui-command-model
  name: '@omdsh/tui/command-model'

- id: tui-command-transcript
  name: '@omdsh/tui/command-transcript'

- id: tui-command-attachment
  name: '@omdsh/tui/command-attachment'

- id: tui-command-integrations
  name: '@omdsh/tui/command-integrations'

- id: runner
  name: '@omdsh/tui/runner'
