# omdsh composition — the TUI coding agent over the DeepSeek Harness core
# runtime. No Host, no HTTP, no browser layer: local executors, the
# executor-less agent spine, the DeepSeek adapter, and the omdsh TUI seam
# (provider + interactive runner).
#
# Model/provider rows read the CLI/environment overrides through the
# harness's sanctioned dynamic-config mechanism (!!js under plugin config).

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "(process.env.OMDSH_HOME || process.env.DSH_HOME || process.env.HOME + '/.dsh') + '/sessions'"

- id: session-checkpoint
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 8
    fallbackMaxBytes: 80
    maxTitleBytes: 120

- id: session-stats
  name: '@deepseek-ai/dsh-session-stats'

- id: attachments
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    dshHome: !!js process.env.OMDSH_HOME || process.env.DSH_HOME || undefined

# User settings document ($DSH_HOME/settings.yaml) and credential sources
# (inherited env, managed .credentials.yaml, project/user .env) — the same
# rows the harness base mounts, so omdsh honors the user's existing model
# route and API key setup out of the box.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'
  config:
    dshHome: !!js process.env.OMDSH_HOME || process.env.DSH_HOME || undefined

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    dshHome: !!js process.env.OMDSH_HOME || process.env.DSH_HOME || undefined

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: !!js process.env.OMDSH_PROVIDER || 'deepseek-official'
    model: !!js process.env.OMDSH_MODEL || 'deepseek-v4-flash'

- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.OMDSH_PERMISSION_MODE || 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

# Every session starts with one explicit access preset. The environment is a
# deployment override; the TUI switches it later through the /permission picker.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.OMDSH_PERMISSION_MODE || 'workspace-write'
    workspaceRoot: !!js process.cwd()

- id: fs
  name: '@deepseek-ai/dsh-fs-local'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: Read only
        description: Inspect the workspace without writing; escalation requires approval.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: Workspace write
        description: Write inside the workspace; wider access requires approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Full access
        description: Full filesystem access without approval prompts.

- id: spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536
    dshHome: !!js process.env.OMDSH_HOME || undefined
    skills:
      enabled: true
    goals:
      domain: {}
      tool: {}

# Human and model workflow contributions. The TUI discovers human commands
# from dsh-commands and renders unknown tools through its safe fallback.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  config:
    section: |
      You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

      Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

      The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

      Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

      Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public interface, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

      When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'

- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: subagent-list
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tui
  name: '@agi-fans/dsh-tui'
  config:
    model: !!js process.env.OMDSH_MODEL || 'deepseek-v4-flash'

- id: tui-tool-presentation
  name: '@agi-fans/dsh-tui/tool-presentation'

- id: tui-session-runtime
  name: '@agi-fans/dsh-tui/session-runtime'

- id: tui-human-interaction
  name: '@agi-fans/dsh-tui/human-interaction'

- id: tui-command-session
  name: '@agi-fans/dsh-tui/command-session'

- id: tui-command-steer
  name: '@agi-fans/dsh-tui/command-steer'

- id: tui-command-loop
  name: '@agi-fans/dsh-tui/command-loop'

- id: tui-command-model
  name: '@agi-fans/dsh-tui/command-model'

- id: tui-command-auth
  name: '@agi-fans/dsh-tui/command-auth'

- id: tui-command-export
  name: '@agi-fans/dsh-tui/command-export'

- id: tui-command-integrations
  name: '@agi-fans/dsh-tui/command-integrations'

- id: tui-startup-notices
  name: '@agi-fans/dsh-tui/startup-notices'

- id: runner
  name: '@agi-fans/dsh-tui/runner'
