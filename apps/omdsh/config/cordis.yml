# omdsh product bundle — one insert over an empty Profile root.
# TUI coding agent over the DeepSeek Harness core runtime. No Host, no HTTP, no
# browser layer: local executors, the executor-less agent spine, the DeepSeek
# adapter, and the omdsh TUI seam (provider + interactive runner).
#
# Model/provider rows read the CLI/environment overrides through the
# harness's sanctioned dynamic-config mechanism (!!js under plugin config).

- insert:
  - id: timer
    name: '@deepseek-ai/cordis-plugin-timer'

  - id: llm
    name: '@deepseek-ai/dsh-llm'

  - id: llm-deepseek
    name: '@deepseek-ai/dsh-llm-deepseek'
    config:
      # Current built-ins share this fallback. Exact catalog values still win,
      # and omitting models keeps future adapter additions visible.
      maxTokens: 384000

  - id: session
    name: '@deepseek-ai/dsh-session'

  - id: session-persistence
    name: '@deepseek-ai/dsh-session-persistence-jsonl'
    config:
      root: !!js "(process.env.OMDSH_HOME || process.env.DSH_HOME || process.env.HOME + '/.dsh') + '/sessions'"

  - id: session-checkpoint
    name: '@deepseek-ai/dsh-session-checkpoint-policy'

  - id: session-projection
    name: '@deepseek-ai/dsh-session-projection'

  - id: session-title
    name: '@deepseek-ai/dsh-session-title'
    config:
      fallbackMaxWords: 8
      fallbackMaxBytes: 80
      maxTitleBytes: 120

  - id: session-stats
    name: '@deepseek-ai/dsh-session-stats'

  # Exact session reads for @session mentions, plus lazy full-text search.
  # openAt: first-search keeps startup free of experimental node:sqlite; the
  # index opens only when a human actually searches the session library.
  - id: session-query
    name: '@deepseek-ai/dsh-session-query-sqlite'
    config:
      path: ':memory:'
      openAt: first-search

  - id: session-reference
    name: '@deepseek-ai/dsh-session-reference'

  # Workspace @file discovery. The TUI owns mention syntax; this provider
  # ranks path-only candidates and, when `read` is visible, adds the stable
  # file-reference instruction. Selecting a row still inserts a path.
  - id: file-reference
    name: '@deepseek-ai/dsh-file-reference-local'

  - id: attachments
    name: '@deepseek-ai/dsh-attachment-local'
    config:
      dshHome: !!js process.env.OMDSH_HOME || process.env.DSH_HOME || undefined

  # User settings document ($DSH_HOME/settings.yaml) and credential sources
  # (inherited env, managed .credentials.yaml, project/user .env) — the same
  # rows the harness base mounts, so omdsh honors the user's existing model
  # route and API key setup out of the box.
  - id: settings
    name: '@deepseek-ai/dsh-settings-file'
    config:
      dshHome: !!js process.env.OMDSH_HOME || process.env.DSH_HOME || undefined

  - id: credentials
    name: '@deepseek-ai/dsh-credentials-local'
    config:
      dshHome: !!js process.env.OMDSH_HOME || process.env.DSH_HOME || undefined

  - id: authorization
    name: '@deepseek-ai/dsh-authorization'

  - id: authorization-invariant
    name: '@deepseek-ai/dsh-authorization/invariant'

  # Dormant multi-provider twin: zero extra picker routes until a `llm-pi-ai:`
  # settings section supplies profiles. /login writes those profiles; /model
  # lists whatever routes become live. Keep llm-deepseek as the official
  # DeepSeek identity — its route is `deepseek-official`, not catalog `deepseek`.
  - id: llm-pi-ai
    name: '@deepseek-ai/dsh-llm-pi-ai'

  - id: agent
    name: '@deepseek-ai/dsh-agent'

  - id: agent-default-model
    name: '@deepseek-ai/dsh-agent-default-model'
    config:
      provider: !!js process.env.OMDSH_PROVIDER || 'deepseek-official'
      model: !!js process.env.OMDSH_MODEL || 'deepseek-flash'

  - id: agent-presets
    name: '@deepseek-ai/dsh-agent-presets'
    config:
      default: standard
      includeShippedRoot: false
      roots:
        - path: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('./agent-presets/', baseUrl))"
          trust: system

  - id: commands
    name: '@deepseek-ai/dsh-commands'

  - id: user-questions
    name: '@deepseek-ai/dsh-user-questions'

  - id: approval
    name: '@deepseek-ai/dsh-user-approval'
    config:
      policy: !!js "(process.env.OMDSH_PERMISSION_MODE || 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

  # Every session starts with one explicit access preset. The environment is a
  # deployment override; the TUI switches it later through the /permission picker.
  - id: sandbox
    name: '@deepseek-ai/dsh-sandbox-local'

  - id: sandbox-policy
    name: '@deepseek-ai/dsh-sandbox-policy'
    config:
      mode: !!js process.env.OMDSH_PERMISSION_MODE || 'workspace-write'
      workspaceRoot: !!js process.cwd()

  - id: fs
    name: '@deepseek-ai/dsh-fs-sandbox'

  - id: fs-observation-policy
    name: '@deepseek-ai/dsh-fs-observation-policy'

  - id: subprocess
    name: '@deepseek-ai/dsh-subprocess-local'

  # Exactly one shell stack mounts per host: the bash stack gates off Windows
  # and its PowerShell twin gates off everything else, so a session always has
  # one confined shell and never a tool whose interpreter is missing. Timeouts
  # are pinned rather than inherited: upstream's 60s base default is short for
  # ordinary builds and test suites, and the model can still raise the limit
  # per call or run the command in the background.
  - id: bash
    name: '@deepseek-ai/dsh-bash-sandbox'
    disabled: !!js process.platform === 'win32'
    config:
      timeoutMs: 120000

  - id: pwsh
    name: '@deepseek-ai/dsh-pwsh-sandbox'
    disabled: !!js process.platform !== 'win32'
    config:
      timeoutMs: 120000

  - id: permission
    name: '@deepseek-ai/dsh-permission-presets'
    config:
      presets:
        read-only:
          sandbox: read-only
          approval: ask
          name: Read only
          description: Inspect the workspace without writing; escalation requires approval.
        workspace-write:
          sandbox: workspace-write
          approval: ask
          name: Workspace write
          description: Write inside the workspace; wider access requires approval.
        danger-full-access:
          sandbox: danger-full-access
          approval: never
          name: Full access
          description: Full filesystem access without approval prompts.

  # — spine 展开块（替代已删除的 @deepseek-ai/dsh-agent-spine-demo）—
  # 顺序遵循上游 spine apply() 的挂载顺序；agent-instructions 必须先于
  # tool-skill 注册（两者都以 session 前缀消息注入，注册顺序即渲染顺序）。
  - id: system-prompt
    name: '@deepseek-ai/dsh-system-prompt'

  - id: tools
    name: '@deepseek-ai/dsh-tools'
    config:
      mode: native

  - id: skill
    name: '@deepseek-ai/dsh-skill'

  - id: skill-filesystem
    name: '@deepseek-ai/dsh-skill-filesystem'
    config:
      dshHome: !!js process.env.OMDSH_HOME || undefined

  - id: llm-retry
    name: '@deepseek-ai/dsh-llm-retry'

  - id: goal
    name: '@deepseek-ai/dsh-goal'

  - id: tool-goal
    name: '@deepseek-ai/dsh-tool-goal'

  - id: goal-round-driver
    name: '@deepseek-ai/dsh-goal-round-driver'

  - id: jobs
    name: '@deepseek-ai/dsh-jobs-local'

  - id: invariants
    name: '@deepseek-ai/dsh-invariants'

  - id: session-invariant
    name: '@deepseek-ai/dsh-session/invariant'

  - id: agent-invariant
    name: '@deepseek-ai/dsh-agent/invariant'

  - id: scope-invariant
    name: '@deepseek-ai/dsh-scope/invariant'

  - id: agent-loop-invariant
    name: '@deepseek-ai/dsh-agent-loop/invariant'

  - id: shell-env
    name: '@deepseek-ai/dsh-shell-env'
    config:
      dshHome: !!js process.env.OMDSH_HOME || undefined

  - id: tool-bash
    name: '@deepseek-ai/dsh-tool-bash'
    disabled: !!js process.platform === 'win32'

  - id: tool-pwsh
    name: '@deepseek-ai/dsh-tool-pwsh'
    disabled: !!js process.platform !== 'win32'

  - id: agent-instructions
    name: '@deepseek-ai/dsh-agent-instructions'
    config:
      maxBytes: 65536

  - id: tool-skill
    name: '@deepseek-ai/dsh-tool-skill'

  - id: tool-jobs
    name: '@deepseek-ai/dsh-tool-jobs'

  # Persistent, owner-scoped terminal sessions for interactive stdin and
  # cross-call state (REPLs, debuggers, a shell to return to). The one-shot
  # bash/pwsh tools remain the default for bounded commands.
  - id: terminal
    name: '@deepseek-ai/dsh-terminal'

  - id: terminal-bash
    name: '@deepseek-ai/dsh-terminal-bash'

  - id: tool-terminal
    name: '@deepseek-ai/dsh-tool-terminal'

  - id: agent-loop
    name: '@deepseek-ai/dsh-agent-loop'
    config:
      agents: []

  - id: code-runtime
    name: '@deepseek-ai/dsh-code-runtime-worker-thread'

  - id: cordis-host-runner
    name: '@deepseek-ai/dsh-cordis-host-runner'

  # Human and model workflow contributions. The TUI discovers human commands
  # from dsh-commands and renders unknown tools through its safe fallback.
  - id: command-goal
    name: '@deepseek-ai/dsh-command-goal'

  - id: tool-ask-user
    name: '@deepseek-ai/dsh-tool-ask-user'

  - id: plan-mode
    name: '@deepseek-ai/dsh-plan-mode'
    config:
      section: |
        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public interface, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

  - id: tool-fs
    name: '@deepseek-ai/dsh-tool-fs'

  - id: tool-fs-search
    name: '@deepseek-ai/dsh-tool-fs-search'
    config:
      sampleOverCapGlobResults: false

  - id: tool-todo
    name: '@deepseek-ai/dsh-tool-todo'
    config:
      allowParallelInProgress: true

  - id: tool-str-replace-editor
    name: '@deepseek-ai/dsh-tool-str-replace-editor'
    config:
      maxOutputChars: 16000

  # Deliverables: the model declares the workspace files it finished so the
  # user can find them afterwards. The files are not copied or preserved — the
  # card lists their source paths, and the TUI renders that list instead of the
  # raw call arguments.
  - id: tool-present
    name: '@deepseek-ai/dsh-tool-present'

  # Anonymous public web fetch, no credential and no search provider: a fetch
  # costs nothing and the TUI already renders web sources. Search stays off
  # because DeepSeek's native search spends a whole model turn per query; a
  # deployment that wants it mounts a provider in its own overlay and flips
  # `search` on here.
  - id: web
    name: '@deepseek-ai/dsh-web'

  - id: web-fetch-http
    name: '@deepseek-ai/dsh-web-fetch-http'

  - id: tool-web
    name: '@deepseek-ai/dsh-tool-web'
    config:
      search: false
      fetch: true

  # Spills one oversized plain-text tool result to a private file and hands the
  # model a bounded preview plus the path. The cap is deliberately far above
  # upstream's 50 KB: the session log carries the replacement, so a lower cap
  # would shorten what a human can expand in the transcript.
  - id: spill-local
    name: '@deepseek-ai/dsh-spill-local'

  - id: spill-policy
    name: '@deepseek-ai/dsh-spill-policy'
    config:
      maxInlineBytes: 200000

  - id: token-meter
    name: '@deepseek-ai/dsh-token-meter'

  # Trims oversized tool results before condensation, so the model-visible
  # result stays inside the budget; the full original stays in the session log.
  # compaction-basic reads this through ctx.get, so the row must precede it.
  - id: tool-result-pruner
    name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
    config:
      thresholdChars: 8192
      headChars: 4096
      tailChars: 1024

  - id: compaction
    name: '@deepseek-ai/dsh-compaction-basic'

  - id: command-compact
    name: '@deepseek-ai/dsh-command-compact'

  # Guard rails on the tool chain: a cooperative per-tool deadline, and an
  # advisory reminder when an agent repeats an identical call.
  - id: timeout-policy
    name: '@deepseek-ai/dsh-tool-call-timeout-policy'

  - id: repeat-tool-reminder
    name: '@deepseek-ai/dsh-repeat-tool-reminder'
    config:
      thresholds: [3, 5, 8]
      argumentsPreviewChars: 500

  - id: subagent
    name: '@deepseek-ai/dsh-subagent'

  - id: subagent-spawn
    name: '@deepseek-ai/dsh-subagent-spawn-in-process'
    config:
      providerName: spawn

  # Fork seeds the child with the parent's completed turns, so the inherited
  # prefix stays eligible for KV cache reuse. Model selection is deliberately
  # absent: a child that switched routes would pay for the inherited history
  # again.
  - id: subagent-fork
    name: '@deepseek-ai/dsh-subagent-fork-in-process'
    config:
      providerName: fork

  # Process-isolated transport. Every in-process backend above runs the child
  # agent on the TUI's own event loop, so a heavy delegation starves rendering
  # and the activity animation. This backend spawns a whole child runtime
  # instead, moving that CPU off the TUI thread. It is an extra opt-in
  # transport: `spawn`/`fork` stay mounted and keep their parent-shared
  # features, which ACP cannot honour.
  #
  # ACP advertises no start-time capabilities and implements no continuable
  # runs, so `providerName: acp` must not be selected by a tool that needs
  # `agentOptions`, `persona`, `toolFilter`, a numeric `maxDepth`, or
  # `backgroundMode: continuable`.
  - id: subagent-acp
    name: '@deepseek-ai/dsh-subagent-acp'
    config:
      providerName: acp
      command: !!js process.env.OMDSH_ACP_COMMAND || 'dsh'
      args: !!js (process.env.OMDSH_ACP_ARGS || '--profile acp').split(' ')
      permission: allow
      # The child boots its own profile, so it gets its own home. Leaving the
      # parent's home visible would let the child read the parent's profiles
      # and credentials, and a composition that also delegated by ACP would
      # recurse.
      env:
        DSH_HOME: !!js (process.env.OMDSH_HOME || process.env.DSH_HOME || process.env.HOME + '/.dsh') + '/acp-child'
        OMDSH_HOME: !!js process.env.OMDSH_HOME || process.env.DSH_HOME || undefined
        OMDSH_DEEPSEEK_API_KEY: !!js process.env.OMDSH_DEEPSEEK_API_KEY || undefined
        DEEPSEEK_API_KEY: !!js process.env.DEEPSEEK_API_KEY || process.env.OMDSH_DEEPSEEK_API_KEY || undefined

  - id: subagent-control
    name: '@deepseek-ai/dsh-tool-subagent-control'

  - id: subagent-list
    name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

  - id: tool-subagent
    name: '@deepseek-ai/dsh-tool-subagent'
    config:
      provider: spawn
      toolName: subagent
      backgroundMode: continuable

  - id: tool-subagent-fork
    name: '@deepseek-ai/dsh-tool-subagent'
    config:
      provider: fork
      toolName: subagent_fork
      backgroundMode: continuable

  # The isolated delegation tool. It is a second `dsh-tool-subagent` over the
  # out-of-process backend, so a caller chooses isolation per delegation
  # instead of trading the parent-shared features away globally.
  #
  # Three settings are forced by ACP's absent capabilities, not preferences:
  #   - `maxDepth: provider-managed` — a numeric cap is refused because the
  #     provider cannot enforce recursion depth across a process boundary, and
  #     the child's own composition already bounds it.
  #   - `backgroundMode: one-shot` — the published ACP provider implements no
  #     `prepareContinuable`, so a continuable run is refused at mount.
  #   - no `agentOptions`/`persona`/`toolFilter` — all three are refused.
  # The consequence is user-visible: an isolated child cannot be steered or
  # followed up after dispatch. Use `subagent` when that matters.
  - id: tool-subagent-isolated
    name: '@deepseek-ai/dsh-tool-subagent'
    config:
      provider: acp
      toolName: subagent_isolated
      backgroundMode: one-shot
      maxDepth: provider-managed

  # Workflow and Ralph, as the upstream base bundle mounts them.
  #
  # The worker-thread engine is the seam provider: `dsh-workflow-worker-thread`
  # executes model-written orchestration scripts off the host event loop, which
  # is the same isolation the ACP subagent transport buys for delegation.
  # Mounting `dsh-workflow` as well would double-register `workflowEngine`, so
  # it stays a dependency the engine resolves rather than a composition row.
  - id: workflow-worker-thread
    name: '@deepseek-ai/dsh-workflow-worker-thread'
    config:
      provider: spawn

  # `toolName` is renamed because omdsh already owns a `/workflow` slash command
  # that switches the Default/Plan workflow. The two live in different
  # namespaces (tool vs command) and never collide at runtime, but a bare
  # `workflow` entry in `/tools` would read as that command.
  - id: tool-workflow
    name: '@deepseek-ai/dsh-tool-workflow'
    config:
      toolName: workflow_run

  # Ralph iterates fresh agents over a build-time-fixed script; it reuses the
  # continuable in-process `spawn` provider, so it depends on that transport
  # staying mounted.
  - id: tool-ralph
    name: '@deepseek-ai/dsh-tool-ralph'
    config:
      subagentProvider: spawn
      maxRounds: 64

  - id: tui
    name: '@agi-fans/dsh-tui'
    config:
      model: !!js process.env.OMDSH_MODEL || 'deepseek-flash'

  - id: agent-behavior
    name: '@agi-fans/oh-my-dsh/agent-behavior'

  - id: tui-tool-presentation
    name: '@agi-fans/dsh-tui/tool-presentation'

  - id: tui-session-runtime
    name: '@agi-fans/dsh-tui/session-runtime'

  - id: tui-human-interaction
    name: '@agi-fans/dsh-tui/human-interaction'

  - id: tui-command-session
    name: '@agi-fans/dsh-tui/command-session'

  - id: tui-command-session-configuration
    name: '@agi-fans/dsh-tui/command-session-configuration'

  - id: tui-command-steer
    name: '@agi-fans/dsh-tui/command-steer'

  - id: tui-command-loop
    name: '@agi-fans/dsh-tui/command-loop'

  - id: tui-command-model
    name: '@agi-fans/dsh-tui/command-model'

  - id: tui-command-auth
    name: '@agi-fans/dsh-tui/command-auth'

  - id: tui-command-export
    name: '@agi-fans/dsh-tui/command-export'

  - id: tui-command-diff
    name: '@agi-fans/dsh-tui/command-diff'

  - id: tui-command-trajectory
    name: '@agi-fans/dsh-tui/command-trajectory'

  - id: tui-command-integrations
    name: '@agi-fans/dsh-tui/command-integrations'

  - id: tui-command-jobs
    name: '@agi-fans/dsh-tui/command-jobs'

  - id: tui-startup-notices
    name: '@agi-fans/dsh-tui/startup-notices'

  - id: runner
    name: '@agi-fans/dsh-tui/runner'
